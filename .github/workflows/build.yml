name: ArkUIPlayer Build CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.mm'
      - '**.m'
      - '.github/workflows/build.yml'
      - 'ArkUIPlayer/**'
      - 'foundation/**'
      - 'base/**'
      - 'commonlibrary/**'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-app:
    name: Build ArkUIPlayer App
    runs-on: macos-latest
    timeout-minutes: 180
    # 创建 Release 需要写仓库内容的权限。
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Clean workspace
      run: |
        echo "🔍 Cleaning workspace..."
        rm -rf foundation base commonlibrary out build ArkUIPlayer.xcarchive ArkUIPlayer-IPA
        
        echo "🔍 Restoring clean project.pbxproj file..."
        git checkout -- ArkUIPlayer/ArkUIPlayer.xcodeproj/project.pbxproj

    - name: Install system dependencies
      run: |
        echo "🔍 Installing system dependencies..."
        brew install wget gnu-tar 2>/dev/null || true
        echo "✅ System dependencies installed"

    - name: Setup Node.js 16
      uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Install ACE Tools
      run: |
        echo "🔍 Installing ACE Tools..."
        npm install -g @arkui-x/ace-tools 2>&1 || npm install -g @arkui-x/ace-cli 2>&1 || true
        
        if command -v ace &> /dev/null; then
          echo "✅ ACE Tools installed: $(ace --version)"
        else
          echo "⚠️ ACE Tools installation failed"
        fi

    - name: Download ArkUI-X SDK from official Huawei mirror
      run: |
        echo "🔍 Downloading ArkUI-X SDK from official Huawei mirror..."
        
        SDK_URLS=(
          "https://repo.huaweicloud.com/arkui-crossplatform/sdk/0.0.9.6/darwin/arkui-x-darwin-x64-0.0.9.6-Canary1.zip"
          "https://repo.huaweicloud.com/arkui-crossplatform/sdk/0.0.9.6/darwin/arkui-x-darwin-arm64-0.0.9.6-Canary1.zip"
        )
        
        DOWNLOAD_SUCCESS=0
        
        for url in "${SDK_URLS[@]}"; do
          echo "Trying: $url"
          echo "Checking URL availability..."
          curl -sI "$url" | head -5
          
          echo "Starting download with wget (supports resume)... "
          if wget -c "$url" -O arkui-x-sdk.zip --timeout=60 --tries=5 --waitretry=10; then
            file_size=$(wc -c < arkui-x-sdk.zip)
            echo "File size: $file_size bytes"
            
            if [ "$file_size" -gt 1000000 ]; then
              echo "✅ Downloaded large file ($(($file_size/1024/1024))MB), unzipping..."
              unzip -o arkui-x-sdk.zip -d arkui-x-sdk/ 2>&1
              rm arkui-x-sdk.zip
              
              echo "📁 SDK directory contents:"
              ls -la arkui-x-sdk/ 2>/dev/null || echo "arkui-x-sdk directory is empty"
              find arkui-x-sdk -type f | head -50
              
              echo "✅ SDK downloaded successfully"
              DOWNLOAD_SUCCESS=1
              break
            else
              echo "⚠️ File too small ($file_size bytes), skipping"
              rm arkui-x-sdk.zip
            fi
          else
            echo "⚠️ wget download failed, trying curl..."
            
            if curl -L "$url" -o arkui-x-sdk.zip --fail --max-time 900 --retry 3 --retry-delay 5 --continue-at -; then
              file_size=$(wc -c < arkui-x-sdk.zip)
              echo "File size: $file_size bytes"
              
              if [ "$file_size" -gt 1000000 ]; then
                echo "✅ Downloaded large file ($(($file_size/1024/1024))MB), unzipping..."
                unzip -o arkui-x-sdk.zip -d arkui-x-sdk/ 2>&1
                rm arkui-x-sdk.zip
                
                echo "📁 SDK directory contents:"
                ls -la arkui-x-sdk/ 2>/dev/null || echo "arkui-x-sdk directory is empty"
                find arkui-x-sdk -type f | head -50
                
                echo "✅ SDK downloaded successfully"
                DOWNLOAD_SUCCESS=1
                break
              else
                echo "⚠️ File too small ($file_size bytes), skipping"
                rm arkui-x-sdk.zip
              fi
            else
              echo "⚠️ Download failed: $url"
            fi
          fi
        done
        
        if [ "$DOWNLOAD_SUCCESS" -eq 0 ]; then
          echo "❌ Failed to download ArkUI-X SDK from all sources!"
          exit 1
        fi

    - name: Verify SDK structure and find framework
      run: |
        echo "🔍 Verifying SDK structure..."
        
        if [ ! -d "arkui-x-sdk" ]; then
          echo "❌ arkui-x-sdk directory not found!"
          exit 1
        fi
        
        echo "📁 Full SDK directory listing:"
        ls -laR arkui-x-sdk/
        
        echo ""
        echo "🔍 Searching for XCFramework and framework files..."
        
        XCFRAMEWORK=$(find arkui-x-sdk -name "*.xcframework" -type d | head -1)
        FRAMEWORK=$(find arkui-x-sdk -name "*.framework" -type d | head -1)
        
        echo "Found XCFramework: $XCFRAMEWORK"
        echo "Found Framework: $FRAMEWORK"
        
        if [ -z "$XCFRAMEWORK" ] && [ -z "$FRAMEWORK" ]; then
          echo "❌ Neither XCFramework nor Framework found in SDK!"
          echo "Listing all files to debug:"
          find arkui-x-sdk -type f
          exit 1
        fi

    - name: Copy ArkUI-X framework to project
      run: |
        echo "🔍 Copying ArkUI-X framework to project..."
        
        echo "📋 Listing all XCFramework files in SDK..."
        find arkui-x-sdk -name "*.xcframework" -type d
        
        ARKUI_XCFRAMEWORK=$(find arkui-x-sdk -name "libarkui_ios.xcframework" -type d | head -1)
        
        if [ -z "$ARKUI_XCFRAMEWORK" ]; then
          echo "⚠️ libarkui_ios.xcframework not found, searching for other arkui XCFrameworks..."
          find arkui-x-sdk -name "*arkui*.xcframework" -type d
          
          ARKUI_XCFRAMEWORK=$(find arkui-x-sdk -name "*arkui*.xcframework" -type d | head -1)
        fi
        
        mkdir -p ArkUIPlayer/Frameworks
        
        if [ -n "$ARKUI_XCFRAMEWORK" ]; then
          echo "✅ Found ArkUI XCFramework at: $ARKUI_XCFRAMEWORK"
          cp -r "$ARKUI_XCFRAMEWORK" ArkUIPlayer/Frameworks/
          echo "✅ Copied XCFramework to Frameworks"
        else
          echo "❌ No ArkUI framework found!"
          exit 1
        fi
        
        echo "📁 Frameworks directory contents:"
        ls -la ArkUIPlayer/Frameworks/
        
        if [ -d "ArkUIPlayer/Frameworks/libarkui_ios.xcframework" ]; then
          echo "✅ libarkui_ios.xcframework found in project"
          sed -i '' 's/#define HAS_ARKUI_X 0/#define HAS_ARKUI_X 1/' ArkUIPlayer/ArkUIPlayer/HAPManager.h
          echo "✅ Set HAS_ARKUI_X=1"
        elif [ -d "ArkUIPlayer/Frameworks/libarkui_ios.framework" ]; then
          echo "✅ libarkui_ios.framework found in project"
          sed -i '' 's/#define HAS_ARKUI_X 0/#define HAS_ARKUI_X 1/' ArkUIPlayer/ArkUIPlayer/HAPManager.h
          echo "✅ Set HAS_ARKUI_X=1"
        else
          FRAMEWORK_NAME=$(basename "$ARKUI_XCFRAMEWORK")
          echo "⚠️ Using $FRAMEWORK_NAME instead of libarkui_ios"
          sed -i '' 's/#define HAS_ARKUI_X 0/#define HAS_ARKUI_X 1/' ArkUIPlayer/ArkUIPlayer/HAPManager.h
          echo "✅ Set HAS_ARKUI_X=1"
        fi

    - name: Build ArkUIPlayer using xcodebuild
      run: |
        set -o pipefail
        echo "🔍 Building ArkUIPlayer app..."

        cd ArkUIPlayer
        
        echo "📁 Current directory:"
        pwd
        echo "📁 ArkUIPlayer directory contents:"
        ls -la
        
        FRAMEWORK_DIR="Frameworks"
        echo "📁 Framework directory: $FRAMEWORK_DIR"
        echo "📁 Framework directory contents:"
        ls -la "$FRAMEWORK_DIR" 2>/dev/null || echo "Directory does not exist"
        
        FRAMEWORKS_IN_DIR=$(ls -la "$FRAMEWORK_DIR" 2>/dev/null | grep xcframework | awk '{print $9}')
        
        HEADER_SEARCH_PATHS=""
        LIBRARY_SEARCH_PATHS=""
        OTHER_LDFLAGS=""
        
        if [ -n "$FRAMEWORKS_IN_DIR" ]; then
          echo "Found frameworks in Frameworks: $FRAMEWORKS_IN_DIR"
          
          for fw in $FRAMEWORKS_IN_DIR; do
            FW_NAME=$(echo "$fw" | sed 's/\.xcframework$//')
            echo "Processing framework: $FW_NAME"
            
            echo "📁 XCFramework internal structure:"
            ls -la "$FRAMEWORK_DIR/$fw/"
            
            echo "📁 ios-arm64 directory contents:"
            ls -la "$FRAMEWORK_DIR/$fw/ios-arm64/"
            
            HEADER_PATH="$FRAMEWORK_DIR/$fw/ios-arm64/$FW_NAME.framework/Headers"
            HEADER_PATH_SIM="$FRAMEWORK_DIR/$fw/ios-arm64_x86_64-simulator/$FW_NAME.framework/Headers"
            
            echo "Checking header path: $HEADER_PATH"
            if [ -d "$HEADER_PATH" ]; then
              echo "✅ Header path exists"
              echo "📋 Headers in framework:"
              ls -la "$HEADER_PATH/"
              HEADER_SEARCH_PATHS="$HEADER_SEARCH_PATHS $HEADER_PATH"
            else
              echo "❌ Header path does not exist"
            fi
            
            if [ -d "$HEADER_PATH_SIM" ]; then
              HEADER_SEARCH_PATHS="$HEADER_SEARCH_PATHS $HEADER_PATH_SIM"
            fi
            
            OTHER_LDFLAGS="$OTHER_LDFLAGS -framework $FW_NAME"
          done
          
          LIBRARY_SEARCH_PATHS="."
        fi
        
        echo "Header search paths: $HEADER_SEARCH_PATHS"
        echo "Library search paths: $LIBRARY_SEARCH_PATHS"
        echo "Other LDFlags: $OTHER_LDFLAGS"
        
        if [ -n "$HEADER_SEARCH_PATHS" ] && [ -n "$OTHER_LDFLAGS" ]; then
          echo "📝 Creating xcconfig file..."
          echo 'HEADER_SEARCH_PATHS = $(inherited) $(SRCROOT)/Frameworks/libarkui_ios.xcframework/ios-arm64/libarkui_ios.framework/Headers $(SRCROOT)/Frameworks/libarkui_ios.xcframework/ios-arm64_x86_64-simulator/libarkui_ios.framework/Headers' > ArkUIPlayer/ArkUIOverrides.xcconfig
          # FRAMEWORK_SEARCH_PATHS 指向 xcframework 的真机/模拟器切片目录,这样 -framework libarkui_ios 才能被链接器正确解析到二进制。
          echo 'FRAMEWORK_SEARCH_PATHS = $(inherited) "$(SRCROOT)/Frameworks/libarkui_ios.xcframework/ios-arm64" "$(SRCROOT)/Frameworks/libarkui_ios.xcframework/ios-arm64_x86_64-simulator"' >> ArkUIPlayer/ArkUIOverrides.xcconfig
          echo 'LIBRARY_SEARCH_PATHS = $(inherited) $(SRCROOT)/Frameworks' >> ArkUIPlayer/ArkUIOverrides.xcconfig
          echo 'LD_RUNPATH_SEARCH_PATHS = $(inherited) @executable_path/Frameworks @loader_path/Frameworks' >> ArkUIPlayer/ArkUIOverrides.xcconfig
          # ArkUI-X 依赖的系统 framework:Metal 渲染、CoreGraphics 绘制、Foundation 运行时、
          # UIKit 视图/事件、QuartzCore 动画、CoreText/ImageIO 资源、CFNetwork/Combine等。
          echo 'OTHER_LDFLAGS = $(inherited) -ObjC -lc++ -framework libarkui_ios -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics -framework Metal -framework MetalKit -framework CoreText -framework ImageIO -framework CFNetwork -framework AVFoundation -framework WebKit -framework Combine -framework UserNotifications' >> ArkUIPlayer/ArkUIOverrides.xcconfig
          echo 'WARNING_CFLAGS = -Wno-nullability-completeness' >> ArkUIPlayer/ArkUIOverrides.xcconfig
          echo "✅ Created ArkUIOverrides.xcconfig"
          cat ArkUIPlayer/ArkUIOverrides.xcconfig

          echo "🔨 Starting xcodebuild..."
          xcodebuild -project ArkUIPlayer.xcodeproj \
            -scheme ArkUIPlayer \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            -xcconfig ArkUIPlayer/ArkUIOverrides.xcconfig \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            WARNING_CFLAGS="-Wno-nullability-completeness" 2>&1 | tee build.log || { echo "❌ Build failed"; echo "📋 Last 100 lines of build log:"; tail -100 build.log; exit 1; }
          echo "✅ Build completed successfully"

          # 把 ArkUI XCFramework 的真机切片 framework 拷贝嵌入到 app 的 Frameworks 目录里,
          # 否则运行时 dyld 会因 @rpath/libarkui_ios.framework/libarkui_ios 不存在而崩溃。
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "📦 Embedding ArkUI framework into app bundle..."
            mkdir -p "$APP_PATH/Frameworks"
            if [ -d "Frameworks/libarkui_ios.xcframework/ios-arm64/libarkui_ios.framework" ]; then
              cp -R "Frameworks/libarkui_ios.xcframework/ios-arm64/libarkui_ios.framework" "$APP_PATH/Frameworks/"

              BIN="$APP_PATH/Frameworks/libarkui_ios.framework/libarkui_ios"
              if [ -f "$BIN" ] && command -v lipo >/dev/null 2>&1; then
                ARCHES=$(lipo -info "$BIN" 2>/dev/null | tail -1 || true)
                echo "  Framework binary arches: $ARCHES"
              fi

              # ===== 关键:TrollStore 安装的 unsigned IPA 中,所有 dylib/framework 仍然需要
              # 携带签名(ad-hoc 即可)。如果完全 remove-signature,dyld 在加载 framework 时会
              # 因 "code signature invalid" 直接终止进程,表现为 App 启动即闪退。
              # 这里用 codesign -f -s - 对 framework 主二进制及所有内部 .dylib 强制做 ad-hoc 签名。
              # TrollStore 安装时会校验并接受 ad-hoc 签名。
              if command -v codesign >/dev/null 2>&1; then
                echo "🔐 Ad-hoc signing all binaries in Frameworks/..."
                # 先签 framework 内部的所有 .dylib(如果有的话),从最深层开始签。
                find "$APP_PATH/Frameworks/" -name "*.dylib" -type f | while read -r dylib; do
                  echo " Signing: $dylib"
                  codesign -f -s - "$dylib" 2>/dev/null || echo "  (warning: failed to sign $dylib)"
                done
                # 再签 framework 主二进制(必须在签完其依赖的 dylib 之后)。
                if [ -f "$BIN" ]; then
                  echo "  Signing framework main binary: $BIN"
                  codesign -f -s - "$BIN" 2>/dev/null || echo "  (warning: failed to sign $BIN)"
                fi
                # 对 Frameworks/ 下每个 .framework 目录本身也做签名(签名整个 bundle)。
                find "$APP_PATH/Frameworks/" -name "*.framework" -type d | while read -r fw; do
                  echo "  Signing framework bundle: $fw"
                  codesign -f -s - "$fw" 2>/dev/null || echo "  (warning: failed to sign $fw)"
                done
                echo "✅ Ad-hoc signing complete"
              fi

              echo "✅ Embedded libarkui_ios.framework into $APP_PATH/Frameworks/"
              ls -la "$APP_PATH/Frameworks/"
            fi
          fi
        else
          xcodebuild -project ArkUIPlayer.xcodeproj \
            -scheme ArkUIPlayer \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 2>&1 || { echo "❌ Build failed"; exit 1; }
        fi

        echo "✅ Build completed"

        echo "Searching for .app files..."
        find build -name "*.app" -type d 2>/dev/null

        APP_PATH=$(find build -name "*.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          echo "Found .app at: $APP_PATH"
          ls -la "$APP_PATH/"
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "(no Frameworks/ inside app)"
          du -sh "$APP_PATH"

          # ===== 主二进制存在性校验(TrollStore error 303 的根因排查) =====
          # 从 Info.plist 中读取 CFBundleExecutable 的实际值,确认主二进制文件在 .app 内存在,
          # 否则 IPA 上传后 TrollStore 会报 303 "Unable to locate main binary inside app bundle"。
          echo "🔍 Verifying main binary inside .app..."
          MAIN_BIN_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo "")
          if [ -z "$MAIN_BIN_NAME" ]; then
            echo "❌ CFBundleExecutable missing or Info.plist not processed (still contains \$(EXECUTABLE_NAME))"
            echo "📋 Info.plist contents:"
            cat "$APP_PATH/Info.plist"
            exit 1
          fi
          echo "  CFBundleExecutable = $MAIN_BIN_NAME"

          MAIN_BIN_PATH="$APP_PATH/$MAIN_BIN_NAME"
          if [ ! -f "$MAIN_BIN_PATH" ]; then
            echo "❌ Main binary not found at: $MAIN_BIN_PATH"
            echo "📋 .app contents:"
            ls -la "$APP_PATH/"
            exit 1
          fi

          echo "  Main binary exists: $MAIN_BIN_PATH"
          echo "  File type: $(file "$MAIN_BIN_PATH")"
          if command -v lipo >/dev/null 2>&1; then
            echo "  Architectures: $(lipo -info "$MAIN_BIN_PATH" 2>/dev/null | tail -1)"
            # 必须包含 arm64 切片,TrollStore 在 arm64 设备上安装 armv7-only 包会失败。
            if ! lipo -info "$MAIN_BIN_PATH" 2>/dev/null | grep -q arm64; then
              echo "❌ Main binary does NOT contain arm64 slice!"
              exit 1
            fi
          fi
          echo "✅ Main binary verified (arm64 present)"
        else
          echo "❌ .app file not found!"
          exit 1
        fi

    - name: Package unsigned IPA manually
      run: |
        set -o pipefail
        echo "🔍 Packaging unsigned IPA manually..."

        cd ArkUIPlayer

        APP_PATH=$(find build -name "*.app" -type d | head -1)

        if [ -z "$APP_PATH" ]; then
          echo "❌ .app file not found!"
          exit 1
        fi

        echo "Found .app at: $APP_PATH"
        ls -la "$APP_PATH/"
        du -sh "$APP_PATH"

        # 打包前再次校验主二进制存在(防止 framework 嵌入步骤意外破坏 .app 结构)。
        MAIN_BIN_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo "")
        if [ -z "$MAIN_BIN_NAME" ] || [ ! -f "$APP_PATH/$MAIN_BIN_NAME" ]; then
          echo "❌ Main binary '$MAIN_BIN_NAME' missing before IPA packaging!"
          exit 1
        fi
        echo "✅ Pre-package check: main binary '$MAIN_BIN_NAME' OK"

        mkdir -p ArkUIPlayer-IPA/Payload
        cp -r "$APP_PATH" ArkUIPlayer-IPA/Payload/

        echo "Listing Payload directory:"
        ls -la ArkUIPlayer-IPA/Payload/

        # 校验拷贝到 Payload 后主二进制依然存在。
        PAYLOAD_APP=$(find ArkUIPlayer-IPA/Payload -name "*.app" -type d | head -1)
        if [ ! -f "$PAYLOAD_APP/$MAIN_BIN_NAME" ]; then
          echo "❌ Main binary missing in Payload after copy!"
          exit 1
        fi
        echo "✅ Payload check: $PAYLOAD_APP/$MAIN_BIN_NAME OK"

        cd ArkUIPlayer-IPA
        zip -r ArkUIPlayer.ipa Payload/
        cd ..

        echo "✅ Unsigned IPA packaged successfully"

        ls -la ArkUIPlayer-IPA/
        du -sh ArkUIPlayer-IPA/ArkUIPlayer.ipa

        # ===== IPA 结构诊断 =====
        # 解压 IPA 检查最终产物结构,TrollStore error 303 排查的关键日志。
        echo ""
        echo "🔍 IPA structure diagnostic:"
        unzip -l ArkUIPlayer-IPA/ArkUIPlayer.ipa | head -40
        echo ""
        echo "🔍 Verifying IPA contains main binary..."
        unzip -p ArkUIPlayer-IPA/ArkUIPlayer.ipa "Payload/ArkUIPlayer.app/$MAIN_BIN_NAME" > /dev/null 2>&1 \
          && echo "✅ Main binary present in IPA" \
          || { echo "❌ Main binary MISSING from IPA!"; exit 1; }
        du -sh ArkUIPlayer-IPA/ArkUIPlayer.ipa

    - name: Prepare release metadata
      id: relmeta
      run: |
        # 用 仓库短 SHA + GitHub run number 组成唯一 tag,确保每次构建都能生成独立的 Release。
        SHORT_SHA=$(git rev-parse --short HEAD)
        TAG="v1.0.${{ github.run_number }}-${SHORT_SHA}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "name=ArkUIPlayer $TAG" >> "$GITHUB_OUTPUT"
        echo "📋 Release tag: $TAG"

    - name: Upload IPA to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.relmeta.outputs.tag }}
        name: ${{ steps.relmeta.outputs.name }}
        # 用 commit 信息作为 Release 说明,方便在 Releases 页面看到这次构建对应哪些改动。
        body: |
          ArkUIPlayer unsigned IPA build

          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Run: ${{ github.run_number }}
          - Built at: ${{ github.event.head_commit.timestamp }}

          内含已嵌入的 ArkUI-X 运行时(libarkui_ios.framework),可直接侧载到未越狱 iOS 设备(需自签名)。
        # 标记为预发布,避免覆盖正式版本号。
        prerelease: true
        # 每次 push 都生成新 Release;若同名 tag 已存在则覆盖。
        make_latest: false
        files: |
          ArkUIPlayer/ArkUIPlayer-IPA/ArkUIPlayer.ipa
